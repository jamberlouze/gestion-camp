# Garde le projet Supabase (offre gratuite) éveillé : quelques requêtes à la
# base chaque jour, sinon il est mis en pause après 7 jours. Doublon volontaire
# du cron de worker/index.js — deux gardiens indépendants valent mieux qu'un.
# L'adresse et la clé publique sont lues dans .env.production (aucun réglage
# à faire dans GitHub).
# (Les workflows planifiés ne tournent que sur la branche main.)
name: Supabase — garde-éveil

on:
  schedule:
    - cron: "41 5,13,21 * * *"   # trois fois par jour (UTC)
  workflow_dispatch:             # bouton « Run workflow » pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appel de core.ping()
        run: |
          set -eu
          set -a; . ./.env.production; set +a
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H "Accept-Profile: core" \
            "$VITE_SUPABASE_URL/rest/v1/rpc/ping")
          echo "core.ping → $code"
          [ "$code" = "200" ]
